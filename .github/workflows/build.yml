
name: Build BossBar Extender UIStudio Fix

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle build

      - name: Package the mod JAR as ZIP
        shell: bash
        run: |
          mkdir -p release
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name 'bossbar-extender-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [ -z "$JAR_FILE" ]; then
            echo "Could not find the compiled mod JAR in build/libs"
            exit 1
          fi
          zip -j release/BossBarExtender-UIStudio-Fix.zip "$JAR_FILE"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BossBarExtender-UIStudio-Fix
          path: release/BossBarExtender-UIStudio-Fix.zip
          if-no-files-found: error
